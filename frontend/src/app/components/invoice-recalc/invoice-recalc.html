<div class="page">

  <header class="page-header">
    <div class="header-inner flex align-items-center">
      <div class="flex align-items-center gap-3">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 12h6M9 16h4"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Recálculo de Facturas</h1>
          <p class="brand-subtitle">Sistema de ajuste de valores</p>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="flex flex-column md:flex-row align-items-start gap-4">

      <app-invoice-select
        class="sidebar-col"
        [invoices]="invoices"
        [loading]="loadingInvoices"
        [error]="invoiceLoadError"
        [selected]="selectedInvoice"
        [skeletons]="skeletons"
        (invoiceSelected)="selectInvoice($event)"
        (retry)="loadInvoices()"
      />

      <app-recalc-section
        *ngIf="selectedInvoice"
        class="flex flex-column gap-4 flex-1 min-w-0"
        [invoice]="selectedInvoice"
        (confirmed)="onConfirmed($event)"
      />

    </div>
  </main>

</div>
