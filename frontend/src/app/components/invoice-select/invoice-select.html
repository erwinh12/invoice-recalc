<div class="sidebar-panel">

  <div class="sidebar-panel__header">
    <div class="flex align-items-center gap-2">
      <div class="step-badge">1</div>
      <h2 class="card-title">Facturas</h2>
    </div>
    <span *ngIf="!loading && !error && invoices.length > 0" class="badge">{{ invoices.length }}</span>
  </div>

  <!-- Skeleton loading -->
  <div *ngIf="loading" class="sidebar-list">
    <div *ngFor="let s of skeletons" class="sidebar-item-skeleton">
      <div class="skeleton-line skeleton-line--title"></div>
      <div class="skeleton-line skeleton-line--subtitle" style="margin-top: 6px;"></div>
      <div class="skeleton-amounts flex gap-2" style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #f1f5f9;">
        <div class="flex-1 skeleton-block" style="height: 22px;"></div>
        <div class="flex-1 skeleton-block" style="height: 22px;"></div>
      </div>
    </div>
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="sidebar-state">
    <div class="error-state__icon" style="width: 44px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <p class="error-state__title" style="font-size: 13px; margin-bottom: 2px;">No se pudo cargar</p>
    <p class="error-state__desc" style="font-size: 11px;">Backend en <code>localhost:8080</code></p>
    <button class="btn btn--retry" style="font-size: 11px; padding: 5px 12px; margin-top: 6px;" (click)="retry.emit()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Reintentar
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && !error && invoices.length === 0" class="sidebar-state">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: #94a3b8;">
      <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
      <rect x="9" y="3" width="6" height="4" rx="1"/>
    </svg>
    <span style="font-size: 12px; color: #94a3b8;">No hay facturas disponibles</span>
  </div>

  <!-- Invoice list -->
  <div *ngIf="!loading && !error && invoices.length > 0" class="sidebar-list">
    <div *ngFor="let inv of invoices"
         (click)="invoiceSelected.emit(inv)"
         class="sidebar-invoice-item"
         [class.sidebar-invoice-item--selected]="selected?.id === inv.id">
      <div class="flex justify-content-between align-items-start gap-2">
        <div class="min-w-0 flex-1">
          <p class="invoice-number">{{ inv.invoiceNumber }}</p>
          <p class="invoice-customer">{{ inv.customerName }}</p>
        </div>
        <div *ngIf="selected?.id === inv.id" class="sidebar-check">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
      <div class="sidebar-invoice-item__amounts">
        <div>
          <span class="amount-label">Subtotal</span>
          <span class="amount-value">{{ formatCurrency(inv.subtotal) }}</span>
        </div>
        <div style="text-align: right;">
          <span class="amount-label">Total</span>
          <span class="amount-value amount-value--highlight">{{ formatCurrency(inv.total) }}</span>
        </div>
      </div>
    </div>
  </div>

</div>
