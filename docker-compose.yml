version: '3.8'

services:
  backend:
    build: ./backend
    container_name: invoice-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: invoice-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
